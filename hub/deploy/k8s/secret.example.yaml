# EXAMPLE ONLY — do not apply as-is and never commit a real one. Create the real Secret out of band:
#   kubectl create secret generic memory-hub-secrets \
#     --from-literal=MEMORY_HUB_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
# Plugin secrets (a Slack/Apprise URL, a Memos token, …) go in the same Secret under the env-var *name* you
# type into Settings → Plugins; the hub stores only the name, never the value.
apiVersion: v1
kind: Secret
metadata:
  name: memory-hub-secrets
  labels: { app.kubernetes.io/name: memory-hub }
type: Opaque
stringData:
  MEMORY_HUB_SECRET_KEY: REPLACE-ME-with-a-48-byte-random-string
  # MEMORY_HUB_OIDC_CLIENT_SECRET: ...
  # SLACK_WEBHOOK_URL: ...
