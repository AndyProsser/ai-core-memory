# Self-hosting the memory hub: one container, one volume, no other services.
#   cp .env.example .env   # set MEMORY_HUB_SECRET_KEY and MEMORY_HUB_PUBLIC_URL
#   docker compose up -d --build
#   docker compose logs memory-hub | grep "setup code"    # then open the URL and finish first-run setup
services:
  memory-hub:
    build: .
    image: ghcr.io/andyprosser/ai-core-memory-hub:latest  # `docker compose pull` fetches the published image; `up --build` builds it locally instead
    restart: unless-stopped
    ports:
      # Loopback by default. To serve your LAN set MEMORY_HUB_BIND=0.0.0.0; for anything beyond a LAN put a TLS
      # reverse proxy in front and set MEMORY_HUB_TRUST_PROXY=true plus MEMORY_HUB_TRUSTED_PROXIES.
      - "${MEMORY_HUB_BIND:-127.0.0.1}:${MEMORY_HUB_PORT:-8000}:8000"
    volumes:
      - hub-data:/data
      # Obsidian plugin: mount your vault read-only and use /vault as its path in Settings → Plugins.
      # - ${OBSIDIAN_VAULT_DIR}:/vault:ro
    # Plugin secrets (Slack/Teams webhook URLs, a Memos token, ...) are referenced *by environment variable name* in the
    # Plugins screen; put the values in .env and they reach the container here. They are never written to the database.
    env_file:
      - path: .env
        required: false
    environment:
      MEMORY_HUB_DB_PATH: /data/hub.sqlite3
      MEMORY_HUB_SECRET_KEY: ${MEMORY_HUB_SECRET_KEY:?set MEMORY_HUB_SECRET_KEY in .env}
      MEMORY_HUB_PUBLIC_URL: ${MEMORY_HUB_PUBLIC_URL:-http://localhost:8000}
      MEMORY_HUB_ADMIN_EMAIL: ${MEMORY_HUB_ADMIN_EMAIL:-}
      MEMORY_HUB_TRUST_PROXY: ${MEMORY_HUB_TRUST_PROXY:-false}
      MEMORY_HUB_TRUSTED_PROXIES: ${MEMORY_HUB_TRUSTED_PROXIES:-}  # who may set X-Forwarded-*: your proxy's IP/CIDR, never *
      MEMORY_HUB_CLIENT_IP_HEADER: ${MEMORY_HUB_CLIENT_IP_HEADER:-}  # e.g. CF-Connecting-IP when a CDN fronts the proxy
      MEMORY_HUB_ALLOWED_HOSTS: ${MEMORY_HUB_ALLOWED_HOSTS:-}  # optional Host allow-list (public URL + loopback always pass)
      MEMORY_HUB_HSTS_MAX_AGE: ${MEMORY_HUB_HSTS_MAX_AGE:-31536000}  # sent only when MEMORY_HUB_PUBLIC_URL is https; 0 = off
      MEMORY_HUB_CONSOLIDATE_INTERVAL_HOURS: ${MEMORY_HUB_CONSOLIDATE_INTERVAL_HOURS:-24}
      MEMORY_HUB_PLUGINS: ${MEMORY_HUB_PLUGINS:-true}  # false = emergency off-switch for every plugin
      MEMORY_HUB_REMOTE_PLUGINS: ${MEMORY_HUB_REMOTE_PLUGINS:-}  # JSON list of {key,url,secret_env}; see docs/PLUGINS.md
      MEMORY_HUB_OAUTH_ENABLED: ${MEMORY_HUB_OAUTH_ENABLED:-false}  # MCP OAuth for Claude.ai connectors; needs https PUBLIC_URL
      MEMORY_HUB_OAUTH_EXTRA_REDIRECT_URIS: ${MEMORY_HUB_OAUTH_EXTRA_REDIRECT_URIS:-}
      # Optional single sign-on. Leave empty for local accounts only.
      MEMORY_HUB_OIDC_ISSUER: ${MEMORY_HUB_OIDC_ISSUER:-}
      MEMORY_HUB_OIDC_CLIENT_ID: ${MEMORY_HUB_OIDC_CLIENT_ID:-}
      MEMORY_HUB_OIDC_CLIENT_SECRET: ${MEMORY_HUB_OIDC_CLIENT_SECRET:-}

volumes:
  hub-data:
