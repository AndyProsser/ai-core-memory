[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-core-memory-hub"
version = "0.1.0"
description = "Self-hostable memory hub: central store, MCP server, web UI, and offline CLI for AI assistant memory."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "mcp>=2.2,<3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "joserfc>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# Slack/Teams/ntfy/email notifications via the `apprise` plugin. Optional: the hub runs without it.
notify = ["apprise>=1.8"]
dev = ["pytest>=8", "ruff>=0.5", "apprise>=1.8"]

[project.scripts]
acm = "acm_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["acm_hub*"]

[tool.setuptools.package-data]
acm_hub = ["web/templates/*.html", "web/static/*", "migrations/*.py", "migrations/versions/*.py", "migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
