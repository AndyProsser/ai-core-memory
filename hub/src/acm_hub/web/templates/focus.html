{% extends "base.html" %}
{% block title %}Focus{% endblock %}
{% block content %}
<header class="page"><div><h1>Focus preview</h1>
  <p class="muted">Type a task to see exactly what an AI would be handed for it, and why.</p></div></header>
<form method="get" action="/focus" class="card" hx-get="/focus" hx-target="#focus-results" hx-push-url="true" hx-trigger="submit">
  <label for="task" style="margin-top:0">What are you working on?</label>
  <textarea id="task" name="task" style="min-height:4.5rem" data-search placeholder="e.g. fix the retry logic on the payments webhook">{{ task }}</textarea>
  <div class="row">
    <div><label for="project">Project</label><select id="project" name="project"><option value="">(none)</option>{% for p in projects %}<option value="{{ p }}" {% if p == project %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
    <div><label for="topics">Topics</label><input id="topics" type="text" name="topics" value="{{ topics }}" placeholder="optional, comma-separated"></div>
    <div><label for="budget">Token budget</label><input id="budget" type="number" name="budget" value="{{ budget }}" min="500" max="20000" step="500"></div>
  </div>
  <label class="inline" style="margin-top:.8rem"><input type="checkbox" name="cross" value="1" {% if cross %}checked{% endif %}> Include other projects' memory</label>
  <div class="actions"><button class="primary" type="submit">Show context pack</button></div>
</form>
<div id="focus-results">{% include "_focus_results.html" %}</div>
{% endblock %}
